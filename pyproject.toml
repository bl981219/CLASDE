[project]
name = "clasde"
version = "0.3.1"
description = "Formalized Closed-Loop Surface Optimization Engine"
authors = [
    { name = "Mengren Bill Liu" }
]
dependencies = [
    "ase>=3.22.1",
    "pymatgen>=2024.1.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "typing_extensions>=4.5.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "chgnet>=0.3.0",
    "tenacity>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-env>=1.0.0",
    "pytest-mock>=3.10"
]

[project.scripts]
clasde-loop = "cli.loop_cli:main"
clasde-builder = "cli.builder_cli:main"
clasde-visualize = "cli.visualize_cli:main"
clasde-collaborator = "cli.collaborator_cli:main"
clasde-explore = "cli.explore_cli:main"
clasde-watchdog = "autonomous_watchdog:main"
clasde-demo = "examples.teaching_demo:main"

[tool.setuptools]
packages = ["agents", "cli", "core", "execution", "memory", "optimization", "science", "workflows"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
