name: "STO_B_Site_Doping_ORR"
description: "Optimization of B-site dopants on STO for ORR activity."
original_prompt: "I want to optimize the oxygen reduction reaction (ORR) activity on SrTiO3 (STO) by doping the B-site with transition metals (Ta, Mn, Fe, Co, Ni). Run a closed-loop tuning campaign using CHGNet to rapidly screen different dopant types and concentrations at the surface. Your goal is to find a dopant configuration that brings the Oxygen adsorption energy (E_ads) closest to -1.2 eV."

research_mode: "tuning"
finetune_mlip: true

objective:
  type: "adsorption_tuning"
  adsorbate: "O"
  target_e_ads: -1.2

constraints:
  bulk:
    Sr: 1.0
    Ti: 1.0
    O: 3.0
  facet: [0, 0, 1]
  allowed_dopants: ["Ta", "Mn", "Fe", "Co", "Ni"]

budget:
  max_evaluations: 10

compute:
  platform: "local"
  mode: "chgnet"
  metadata:
    bulk_supercell: [2, 2, 4]
