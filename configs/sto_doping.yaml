name: "STO_B_Site_Doping_Optimization"
description: "Optimization of transition metal doping (Mn, Fe, Co) on SrTiO3 (001) to maximize oxygen affinity."
original_prompt: "whats the doping effect on SrTiO3 B-site? suggest element for doping and show the change effect on Oxygen adsorption"

research_mode: "tuning"

objective:
  type: "adsorption_tuning"
  adsorbate: "O"
  target_e_ads: -1.5

constraints:
  bulk:
    Sr: 1.0
    Ti: 1.0
    O: 3.0
  facet: [0, 0, 1]
  allowed_actions: ["substitutional_dopant", "modify_coverage", "change_adsorbate"]

budget:
  max_evaluations: 30

acquisition:
  acquisition_type: "EI"

compute:
  mode: "local_emt"
  nodes: 4
