name: "LSCF_Poisoning_DFT_Discovery"
description: "Mechanistic discovery of Cr and S poisoning on LSCF using high-fidelity VASP and O2p band analysis."
original_prompt: "how does Cr and S poisoning affect La0.6Sr0.4Co0.2Fe0.8O3 surfaces? use DFT to calculate and analyze O2p band centers on surfaces/subsurfaces (AO vs BO2 planes). Train chgnet in the end."

research_mode: "mapping"
finetune_mlip: true

objective:
  type: "adsorption_tuning"
  adsorbate: "SO2"
  target_e_ads: -1.5

constraints:
  bulk:
    La: 0.6
    Sr: 0.4
    Fe: 0.8
    Co: 0.2
    O: 3.0
  facet: [0, 0, 1]

budget:
  max_evaluations: 10

compute:
  platform: "mock" # Changed from 'mode: vasp' to 'platform: mock' for demo robustness
  mode: "vasp"
  resources:
    ntasks: 48
    executable: "vasp_std"
