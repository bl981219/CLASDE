budget:
  max_evaluations: 5
compute:
  mode: chgnet
  platform: local
  resources:
    nodes: 2
    ntasks: 48
  vasp_params:
    IBRION: 2
    NSW: 50
constraints:
  bulk:
    Fe: 1.0
    La: 0.5
    O: 3.0
    Sr: 0.5
  facet:
  - 0
  - 0
  - 1
description: Multi-fidelity study of Sr segregation on LSF(001).
finetune_mlip: true
name: LSF_Sr_Segregation_Study
objective:
  target_species: Sr
  type: stability
original_prompt: I am interested in how Sr-segregation behaves on La0.5Sr0.5FeO3 (LSF)
  (001) surfaces. Please perform a multi-fidelity research campaign where you first
  use the universal CHGNet potential to explore a range of surface cation configurations
  (swapping La and Sr between the surface and subsurface). For the most stable 5 configurations
  found by CHGNet, perform high-accuracy VASP DFT calculations on the Supercloud cluster
  using 2 nodes each to validate the segregation energy. Finally, fine-tune CHGNet
  on this specific LSF dataset to see if its prediction accuracy improves.
research_mode: mapping
