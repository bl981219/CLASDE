name: "LSF_Sr_Segregation_Study"
description: "Multi-fidelity study of Sr segregation on LSF(001)."
original_prompt: "I am interested in how Sr-segregation behaves on La0.5Sr0.5FeO3 (LSF) (001) surfaces. Please perform a multi-fidelity research campaign where you first use the universal CHGNet potential to explore a range of surface cation configurations (swapping La and Sr between the surface and subsurface). For the most stable 5 configurations found by CHGNet, perform high-accuracy VASP DFT calculations on the Supercloud cluster using 2 nodes each to validate the segregation energy. Finally, fine-tune CHGNet on this specific LSF dataset to see if its prediction accuracy improves."

research_mode: "mapping"
finetune_mlip: true

objective:
  type: "segregation"
  target_species: "Sr"

constraints:
  bulk:
    La: 0.5
    Sr: 0.5
    Fe: 1.0
    O: 3.0
  facet: [0, 0, 1]

budget:
  max_evaluations: 10 # 5 MLIP screenings + 5 DFT validations

compute:
  platform: "hpc" 
  mode: "mixed" # Automatically switch to DFT for top candidates
  resources:
    nodes: 2
    ntasks: 48
  vasp_params:
    NSW: 50
    IBRION: 2
