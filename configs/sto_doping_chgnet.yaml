name: "STO_Doping_CHGNET_Tuning"
description: "Optimization of transition metal dopants on SrTiO3 (001) using the universal CHGNet potential."
original_prompt: "whats the doping effect on SrTiO3 B-site? suggest element for doping and show the change effect on Oxygen adsorption. use chgnet."

research_mode: "tuning"

objective:
  type: "adsorption_tuning"
  adsorbate: "O"
  target_e_ads: -1.5

constraints:
  bulk:
    Sr: 1.0
    Ti: 1.0
    O: 3.0
  facet: [0, 0, 1]

budget:
  max_evaluations: 15

compute:
  mode: "chgnet"
