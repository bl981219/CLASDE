name: "LSF_Segregation_EMT_Stability"
description: "Rapid mapping of Sr surface segregation in LSF using local EMT potential."
original_prompt: "how does Sr segregation in La0.6Sr0.4FeO3 depend on T and PO2? use EMT for structural iterations."

research_mode: "stability"

objective:
  type: "segregation"
  target_species: "Sr"

constraints:
  bulk:
    La: 0.6
    Sr: 0.4
    Fe: 1.0
    O: 3.0
  facet: [0, 0, 1]

budget:
  max_evaluations: 20

compute:
  platform: "local"
  mode: "local_emt"
  resources:
    ntasks: 1
